<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Public Shoutbox</title>
    <!-- <link rel="stylesheet" href="/style.css"> -->
</head>

<body class="{{THEME_CLASS}}">
    <h1>Public Shoutbox</h1>

    <!-- Message Submission Form -->
    <form action="/shoutbox" method="GET" class="shout-form">
        <input type="text" name="msg" placeholder="Type a message..." required>
        <button type="submit">Shout!</button>
    </form>

    <div class="shoutbox">
        <ul>
            {{MESSAGES}}
        </ul>
    </div>

    <nav>
        <a href="/">Home</a> |
        <a href="/projects">Projects</a>

    </nav>
</body>

</html>
